<!DOCTYPE html>
<html lang="de-de">
<head>
    <meta charset="UTF-8">
    <title>SmartHomeWeb - Startseite</title>
    <!--
    <link rel="stylesheet" href="../../static/web/styles/base.css">
    <link rel="stylesheet" href="../../static/web/styles/smarthomestyles_static.css">
    -->
    {% load bootstrap5 %}
    {% bootstrap_css %}
    {% bootstrap_javascript %}
    <!--
        https://getbootstrap.com/docs/5.3/getting-started/javascript/#data-attributes

    -->
</head>

<body>
    <div class="press">
        <h1>Luftdruck:</h1>
        <a href="{% url 'index' %}" class="btn btn-secondary mb-3">&larr; Startseite</a>
        <div class="mb-3">
            <form method="post" action="">
                {% csrf_token %}
                {{ form }}
                <br>
                <input type="submit" value="Filter...">
            </form>
        </div>
        <ul>
            {% for press in presslist %}
            <li>
                {{ press.id }},
                {{ press.luftdruck }},
                {{ press.sen.raum }},
                {{ press.datum }},
                <a href="{{ press.sen.id }}/">
                    Details...
                </a>

            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
