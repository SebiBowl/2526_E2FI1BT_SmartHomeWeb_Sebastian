{% extends "web/base.html" %}
{% load bootstrap5 %}

{% block title %}Sensor bearbeiten – SmartHomeWeb{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <h1 class="h4 card-title mb-4">
                    <i class="bi bi-pencil-square me-2"></i>Eigenschaften des Sensors
                </h1>
                <form method="post" action="">
                    {% csrf_token %}
                    {% bootstrap_form form %}
                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-1"></i>Speichern
                        </button>
                        <a href="/web/sensors/" class="btn btn-outline-secondary">Abbrechen</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
